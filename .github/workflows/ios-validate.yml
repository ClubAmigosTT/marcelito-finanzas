name: iOS Validate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-validate
  cancel-in-progress: true

jobs:
  build-simulator:
    name: Compilar Marcelito para simulador
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Mostrar toolchain de Apple
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Instalar XcodeGen
        shell: bash
        run: brew install xcodegen

      - name: Generar proyecto Xcode
        working-directory: apps/ios
        shell: bash
        run: xcodegen generate --spec project.yml

      - name: Compilar para iOS Simulator
        working-directory: apps/ios
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project Marcelito.xcodeproj \
            -scheme Marcelito \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/MarcelitoSimulatorDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Escribir resumen
        if: success()
        shell: bash
        run: echo "Compilación de simulador completada." >> "$GITHUB_STEP_SUMMARY"
