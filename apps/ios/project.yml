name: Marcelito
options:
  bundleIdPrefix: mx.marcelito
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  Marcelito:
    type: application
    platform: iOS
    sources:
      - Cauce
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.marcelito.personal
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # La primera distribución de Marcelito es solo para iPhone.
        # Evita declarar iPad hasta contar con launch screen y orientaciones específicas.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Marcelito usa Face ID para proteger el acceso a tus finanzas."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: Marcelito
        # Declara una pantalla de lanzamiento moderna para evitar que iOS use
        # el lienzo de compatibilidad 320x480 en los iPhone actuales.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - MarcelitoTests
  MarcelitoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Marcelito
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.marcelito.personal.tests
